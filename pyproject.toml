[project]
name = "kentik-ansible-collection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ansible==12.2.0",
    "ansible-core==2.19.11rc1",
    "certifi==2024.12.14",
    "cffi==2.1.0",
    "charset-normalizer==3.4.1",
    "cryptography==48.0.1",
    "idna==3.15",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "packaging==24.2",
    "pycparser==2.22",
    "pytz==2024.2",
    "pyyaml==6.0.2",
    "requests==2.33.0",
    "resolvelib==1.0.1",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
